name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Live Postgres for *.integration.test.ts (RUN_INTEGRATION_TESTS=1).
      # Without this, every integration test silently skips and CI never
      # proves the pipeline joints (idempotency races, drain lease, secrets).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calder
          POSTGRES_PASSWORD: calder
          POSTGRES_DB: calder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate database
        run: pnpm --filter @calder/db db:migrate
        env:
          DATABASE_URL: postgresql://calder:calder@localhost:5432/calder

      - name: Test
        run: pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://calder:calder@localhost:5432/calder
          RUN_INTEGRATION_TESTS: "1"

      - name: Build
        run: pnpm build
