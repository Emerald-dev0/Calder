name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Live Postgres for *.integration.test.ts (RUN_INTEGRATION_TESTS=1).
      # Without this, every integration test silently skips and CI never
      # proves the pipeline joints (idempotency races, drain lease, secrets).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calder
          POSTGRES_PASSWORD: calder
          POSTGRES_DB: calder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Redis is no longer optional: the queue unit/integration suites and the
      # end-to-end job assert the durable path (enqueue → worker → provider),
      # and staging/production refuse to boot without it.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: node scripts/security-audit.mjs

      # Exact fixture allowlists live in .gitleaks.toml; real credentials are
      # never allowlisted by path or broad token shape.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --redact --config .gitleaks.toml --exit-code 1

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate database
        run: pnpm --filter @calder/db db:migrate
        env:
          DATABASE_URL: postgresql://calder:calder@localhost:5432/calder

      # Deployment safety gate: no pending migration, and no applied migration
      # whose journal timestamp moved (that is how production lost its auth
      # columns — drizzle re-runs re-timestamped entries).
      - name: Migration status (no drift)
        run: pnpm --filter @calder/db db:status
        env:
          DATABASE_URL: postgresql://calder:calder@localhost:5432/calder

      # Output is captured and uploaded on failure: GitHub's job-log endpoint
      # has been returning EOF for this repo, which makes a red Test step
      # undiagnosable without it.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-output.log
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://calder:calder@localhost:5432/calder
          REDIS_URL: redis://localhost:6379
          RUN_INTEGRATION_TESTS: "1"

      - name: Upload test output (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log
          if-no-files-found: ignore
          retention-days: 5

      # Annotations are readable through the checks API even when the job log
      # and artifacts are not (GitHub's results blob store has been returning
      # EOF). This puts the failing test names where a reader can see them.
      - name: Report failing tests as annotations
        if: failure()
        shell: bash
        run: |
          if [ ! -f test-output.log ]; then
            echo "::error::Test step failed before producing output"
            exit 0
          fi
          emit() {
            local line="$1"
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            echo "::error::${line:0:600}"
          }
          while IFS= read -r line; do emit "$line"; done < <(
            { grep -aE "Test Files +[0-9]+ failed|Tests +[0-9]+ failed" test-output.log || true
              grep -aE "FAIL " test-output.log || true
              grep -aE "AssertionError|Error: " test-output.log | head -5 || true
            } | head -12 | sort -u
          )

      - name: Build
        run: pnpm build

  # End-to-end journey over real HTTP with real Postgres + Redis:
  #   signup → verification → login → org/project → API key → send → worker
  #   → mock provider → delivery state → metering, plus the Redis-outage
  #   durability guarantees. No browser is required, so this runs everywhere;
  #   browser-level UI coverage is tracked in docs/OPERATIONS.md.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calder
          POSTGRES_PASSWORD: calder
          POSTGRES_DB: calder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # E2E runs against its own scratch database: the drain claims queued rows
      # globally by design, so sharing the dev database makes "must stay queued"
      # fixtures race with other suites' drains.
      - name: Create isolated E2E database
        run: |
          psql "postgresql://calder:calder@localhost:5432/calder" -c "CREATE DATABASE calder_e2e"

      - name: Migrate E2E database
        run: pnpm --filter @calder/db db:migrate
        env:
          DATABASE_URL: postgresql://calder:calder@localhost:5432/calder_e2e

      # Turbo, not bare vitest: the suites import @calder/* workspace packages
      # by name, which resolve to each package's dist/ — absent in a fresh
      # checkout. turbo's test task dependsOn ^build, so dependencies are built
      # first (verified: bare `vitest run` fails with "Failed to resolve entry
      # for package @calder/queue" while this command passes).
      #
      # Output is captured and annotated for the same reason as the verify job:
      # GitHub's job-log endpoint returns EOF for this repo, so a red e2e step
      # would otherwise be undiagnosable from the PR.
      - name: End-to-end journeys
        shell: bash
        run: |
          set -o pipefail
          pnpm exec turbo run test --filter=@calder/e2e 2>&1 | tee e2e-output.log
        env:
          NODE_ENV: test
          E2E_DATABASE_URL: postgresql://calder:calder@localhost:5432/calder_e2e
          DATABASE_URL: postgresql://calder:calder@localhost:5432/calder_e2e
          REDIS_URL: redis://localhost:6379
          RUN_INTEGRATION_TESTS: "1"

      - name: Upload e2e output (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: e2e-output.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Report failing tests as annotations
        if: failure()
        shell: bash
        run: |
          if [ ! -f e2e-output.log ]; then
            echo "::error::e2e step failed before producing output"
            exit 0
          fi
          emit() {
            local line="$1"
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            echo "::error::${line:0:600}"
          }
          while IFS= read -r line; do emit "$line"; done < <(
            { grep -aE "Test Files +[0-9]+ failed|Tests +[0-9]+ failed" e2e-output.log || true
              grep -aE "FAIL |× " e2e-output.log || true
              grep -aE "AssertionError|Error: " e2e-output.log | head -8 || true
            } | head -15 | sort -u
          )
