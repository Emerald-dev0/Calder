name: CI

# Least privilege by default. Every job inherits contents:read and a job that
# needs more must say so explicitly.
#
# SHA PINNING: every `uses:` below is pinned to a full commit SHA with its
# release in a trailing comment. A floating `@v4` is a supply-chain dependency:
# whoever can move that tag decides what code runs in this repo's CI, with the
# job token. Dependabot proposes the bumps as ordinary reviewed PRs
# (.github/dependabot.yml); nothing merges itself.
#
# NOTE ON SECRETS: no job triggered by pull_request has access to any
# repository secret. PRs run the zero-secret integrity gate, install, lint,
# typecheck, test and build against throwaway service containers. Deploy-style
# steps and anything holding a credential are gated on
# `github.event_name == 'push' && github.ref == 'refs/heads/main'`.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Source-integrity gate. Runs FIRST, before any dependency is installed
  #    and before any repository code executes.
  #
  #    This ordering is the whole point: the 2026-09 and 2026-10 payloads
  #    lived in files the toolchain runs during install/build/migrate
  #    (next.config.mjs, seed.ts, migrate.ts). A gate that needs `pnpm install`
  #    to run has already executed the thing it is meant to catch.
  #
  #    It only reads files: no install, no build, no secrets, ~2 seconds.
  # ───────────────────────────────────────────────────────────────────────────
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Node 22 for built-in TypeScript type stripping, so the gate imports the
      # shared rule table directly with no install and no build step.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Source integrity gate
        run: node --experimental-strip-types scripts/source-integrity-gate.mjs

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Verify. Unit + integration tests against throwaway service containers.
  #    Runs after the gate so no step here can be the first execution of
  #    poisoned code.
  # ───────────────────────────────────────────────────────────────────────────
  verify:
    needs: source-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Live Postgres for *.integration.test.ts (RUN_INTEGRATION_TESTS=1).
      # Without this, every integration test silently skips and CI never
      # proves the pipeline joints (idempotency races, drain lease, secrets).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calder
          POSTGRES_PASSWORD: calder
          POSTGRES_DB: calder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Redis is no longer optional: the queue unit/integration suites assert
      # the durable path (enqueue → worker → provider), and staging/production
      # refuse to boot without it.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: node scripts/security-audit.mjs

      # Exact fixture allowlists live in .gitleaks.toml; real credentials are
      # never allowlisted by path or broad token shape.
      # `github.token` is the automatic, ephemeral token — not a stored
      # repository secret. Scoped to contents:read above, so even a hostile PR
      # branch cannot use it to read anything the checkout has not already
      # given it. No repository secret is exposed to any pull_request job.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The suite needs a schema. This migrates the EPHEMERAL service container
      # using that container's throwaway credential — never a real database, and
      # never the `db:migrate` script (which runs packages/db/src/migrate.ts).
      # Production migrations are a separate, main-only job below.
      - name: Migrate ephemeral test database (drizzle-kit)
        run: pnpm --filter @calder/db exec drizzle-kit migrate
        env:
          DATABASE_URL: postgresql://calder:calder@localhost:5432/calder

      # Deployment safety gate: no pending migration, and no applied migration
      # whose journal timestamp moved (that is how production lost its auth
      # columns — drizzle re-runs re-timestamped entries).
      - name: Migration status (no drift)
        run: pnpm --filter @calder/db db:status
        env:
          DATABASE_URL: postgresql://calder:calder@localhost:5432/calder

      # Output is captured and uploaded on failure: GitHub's job-log endpoint
      # has been returning EOF for this repo, which makes a red Test step
      # undiagnosable without it.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-output.log
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://calder:calder@localhost:5432/calder
          REDIS_URL: redis://localhost:6379
          RUN_INTEGRATION_TESTS: "1"

      - name: Upload test output (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-output
          path: test-output.log
          if-no-files-found: ignore
          retention-days: 5

      # Annotations are readable through the checks API even when the job log
      # and artifacts are not (GitHub's results blob store has been returning
      # EOF). This puts the failing test names where a reader can see them.
      - name: Report failing tests as annotations
        if: failure()
        shell: bash
        run: |
          if [ ! -f test-output.log ]; then
            echo "::error::Test step failed before producing output"
            exit 0
          fi
          emit() {
            local line="$1"
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            echo "::error::${line:0:600}"
          }
          while IFS= read -r line; do emit "$line"; done < <(
            { grep -aE "Test Files +[0-9]+ failed|Tests +[0-9]+ failed" test-output.log || true
              grep -aE "FAIL " test-output.log || true
              grep -aE "AssertionError|Error: " test-output.log | head -5 || true
            } | head -12 | sort -u
          )

      - name: Build
        run: pnpm build

  # ───────────────────────────────────────────────────────────────────────────
  # 3. End-to-end. Same zero-secret rules as verify; scratch database.
  # ───────────────────────────────────────────────────────────────────────────
  e2e:
    needs: source-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calder
          POSTGRES_PASSWORD: calder
          POSTGRES_DB: calder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # E2E runs against its own scratch database: the drain claims queued rows
      # globally by design, so sharing the dev database makes "must stay queued"
      # fixtures race with other suites' drains.
      - name: Create isolated E2E database
        run: |
          psql "postgresql://calder:calder@localhost:5432/calder" -c "CREATE DATABASE calder_e2e"

      - name: Migrate ephemeral E2E database (drizzle-kit)
        run: pnpm --filter @calder/db exec drizzle-kit migrate
        env:
          DATABASE_URL: postgresql://calder:calder@localhost:5432/calder_e2e

      # Turbo, not bare vitest: the suites import @calder/* workspace packages
      # by name, which resolve to each package's dist/ — absent in a fresh
      # checkout. turbo's test task dependsOn ^build, so dependencies are built
      # first (verified: bare `vitest run` fails with "Failed to resolve entry
      # for package @calder/queue" while this command passes).
      #
      # Output is captured and annotated for the same reason as the verify job:
      # GitHub's job-log endpoint returns EOF for this repo, so a red e2e step
      # would otherwise be undiagnosable from the PR.
      - name: End-to-end journeys
        shell: bash
        run: |
          set -o pipefail
          pnpm exec turbo run test --filter=@calder/e2e 2>&1 | tee e2e-output.log
        env:
          NODE_ENV: test
          E2E_DATABASE_URL: postgresql://calder:calder@localhost:5432/calder_e2e
          DATABASE_URL: postgresql://calder:calder@localhost:5432/calder_e2e
          REDIS_URL: redis://localhost:6379
          RUN_INTEGRATION_TESTS: "1"

      - name: Upload e2e output (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-output
          path: e2e-output.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Report failing tests as annotations
        if: failure()
        shell: bash
        run: |
          if [ ! -f e2e-output.log ]; then
            echo "::error::e2e step failed before producing output"
            exit 0
          fi
          emit() {
            local line="$1"
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            echo "::error::${line:0:600}"
          }
          while IFS= read -r line; do emit "$line"; done < <(
            { grep -aE "Test Files +[0-9]+ failed|Tests +[0-9]+ failed" e2e-output.log || true
              grep -aE "FAIL |× " e2e-output.log || true
              grep -aE "AssertionError|Error: " e2e-output.log | head -8 || true
            } | head -15 | sort -u
          )

  # ───────────────────────────────────────────────────────────────────────────
  # 4. Production migration. `main` only, after the gate, the tests and e2e.
  #
  #    Uses MIGRATION_DATABASE_URL — a credential scoped to migrations, held in
  #    a protected Environment so it can require manual approval. It is not
  #    available to pull_request runs at all: the `if:` below excludes them, and
  #    the environment itself is main-only.
  # ───────────────────────────────────────────────────────────────────────────
  migrate:
    needs: [source-integrity, verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-migrations
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter @calder/db exec drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

      - name: Migration status (no drift)
        run: pnpm --filter @calder/db db:status
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
