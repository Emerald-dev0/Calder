name: Queue processor (best-effort scheduler)

# HONEST SCOPE: GitHub's scheduled workflows are best-effort. GitHub documents
# that runs may be delayed or dropped under load, and schedules are disabled
# after 60 days without repository activity. This is NOT a hard guarantee; it
# is a $0 wake-up that is far better than "only when a customer sends mail".
# A guarantee needs an always-on worker or a scheduler that can page when it
# fails (see docs/QUEUE.md, outcome B).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: queue-processor
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger bounded processor
        env:
          API_URL: ${{ vars.CALDER_API_URL || 'https://api.calder.click' }}
          QUEUE_PROCESSOR_SECRET: ${{ secrets.QUEUE_PROCESSOR_SECRET }}
        run: |
          if [ -z "$QUEUE_PROCESSOR_SECRET" ]; then
            echo "::error::QUEUE_PROCESSOR_SECRET is not configured; the scheduler would be a no-op."
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 90 \
            --output response.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $QUEUE_PROCESSOR_SECRET" \
            --header "x-calder-trigger: scheduler" \
            "$API_URL/v1/jobs/process")
          # The response contains counters only; never echo the request headers.
          cat response.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::processor returned HTTP $status"
            exit 1
          fi
