<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
 <style>
 .journey-path {
 stroke-dasharray: 1 7;
 stroke-dashoffset: 0;
 animation: draw-path 2s ease-out forwards;
 }

 .destination {
 transform-box: fill-box;
 transform-origin: center;
 opacity: 0;
 transform: scale(0.8);
 animation: destination-in 0.45s ease-out 2s forwards;
 }

 .checkmark {
 opacity: 0;
 animation: checkmark-in 0.3s ease-out 2.2s forwards;
 }

 @keyframes draw-path {
 from {
 stroke-dashoffset: 300;
 }
 to {
 stroke-dashoffset: 0;
 }
 }

 @keyframes destination-in {
 from {
 opacity: 0;
 transform: scale(0.8);
 }
 to {
 opacity: 1;
 transform: scale(1);
 }
 }

 @keyframes checkmark-in {
 from {
 opacity: 0;
 }
 to {
 opacity: 1;
 }
 }

 @media (prefers-reduced-motion: reduce) {
 .journey-path {
 animation: none;
 stroke-dashoffset: 0;
 }

 .destination {
 animation: none;
 opacity: 1;
 transform: scale(1);
 }

 .checkmark {
 animation: none;
 opacity: 1;
 }
 }
 </style>

 <rect width="400" height="300" fill="#F5F4EF"/>

 <!-- Journey path -->
 <path
 class="journey-path"
 d="M 55 245
 C 105 235, 105 180, 165 175
 S 235 135, 285 105
 S 325 70, 345 55"
 fill="none"
 stroke="#0B0C0E"
 stroke-width="2"
 stroke-linecap="round"
 />

 <!-- Starting point -->
 <circle
 cx="55"
 cy="245"
 r="7"
 fill="none"
 stroke="#0B0C0E"
 stroke-width="2"
 />

 <!-- Waypoints -->
 <circle
 cx="165"
 cy="175"
 r="6"
 fill="none"
 stroke="#0B0C0E"
 stroke-width="2"
 />

 <circle
 cx="285"
 cy="105"
 r="6"
 fill="none"
 stroke="#0B0C0E"
 stroke-width="2"
 />

 <!-- Destination -->
 <circle
 class="destination"
 cx="345"
 cy="55"
 r="18"
 fill="#3D5AFE"
 />

 <!-- Checkmark -->
 <path
 class="checkmark"
 d="M 336 55 L 342 61 L 354 48"
 fill="none"
 stroke="#FFFFFF"
 stroke-width="3"
 stroke-linecap="round"
 stroke-linejoin="round"
 />
</svg>